#@TYPE: Machine
#@NAME: RBZ MOD_IMX8M_PLUS Board
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for RBZ MOD_IMX8M_PLUS BOARD
#@MAINTAINER: Carlos Amor <camor@rbz.es>

MACHINEOVERRIDES =. "mx8mp:"

require conf/machine/include/rbz-mod-imx8m.inc

KERNEL_DEVICETREE_BASENAME = "mod-imx8m-plus"
KERNEL_DEVICETREE = " \
    rbz/rbz-carrier-basic-imx8m-plus.dtb \
"

UBOOT_DTB_NAME = "mod-imx8m-plus.dtb"

UBOOT_CONFIG_BASENAME = "mod_imx8m_plus"
UBOOT_CONFIG[fspi] = "${UBOOT_CONFIG_BASENAME}_defconfig"
UBOOT_CONFIG[sd]   = "${UBOOT_CONFIG_BASENAME}_defconfig"

ATF_PLATFORM = "imx8mp"
ATF_LOAD_ADDR = "0x970000"

IMX_BOOT_SOC_TARGET = "iMX8MP"
IMX_BOOT_SEEK = "32"

DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"

OPTEE_BIN_EXT = "8mp"
TEE_LOAD_ADDR = "0x56000000"
EXTRA_OEMAKE:append:pn-optee-os = " CFG_UART_BASE=UART3_BASE"
